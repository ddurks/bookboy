name: oidc check
# Temporary fast probe for the OIDC role assumption. Remove once deploy works.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Print real OIDC claims
        run: |
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$TOK" <<'PY'
          import sys, base64, json
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print("sub        =", c.get("sub"))
          print("aud        =", c.get("aud"))
          print("repository =", c.get("repository"))
          print("ref        =", c.get("ref"))
          print("event_name =", c.get("event_name"))
          PY
      - name: Assume role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Who am I
        run: aws sts get-caller-identity
